name: Lint Check

on:
  pull_request:
    branches:
      - development
      - main
      - beta

permissions:
  contents: read

jobs:
  lint-check:
    runs-on: ubuntu-latest
    # Observed fleet-wide over 176 runs: median 0.6 min, max 1.4 min.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint
