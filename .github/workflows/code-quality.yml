name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    # ConductionNL, NOT Conduction. Commit 5f4069ac ("org rename", 2026-06-01)
    # pointed every reusable-workflow call in this repo at `Conduction/.github`,
    # an org that does not exist. Actions cannot resolve it, so from that date
    # every Code Quality run produced ZERO jobs and failed instantly — no
    # ESLint, PHPCS, PHPMD, PHPStan, Psalm, licence scan, security scan or
    # PHPUnit, and no red test to show for it.
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: planix
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      # `ref` moved from `main` to `development`. The E2E job needs the AppHost
      # plumbing planix's own appinfo/routes.php already depends on
      # (`\OCA\OpenRegister\AppHost\Routes::standard()`), and `development` is
      # where that lands first. Pinning the foundation to `main` while this app
      # tracks `development` is what makes a CI instance behave unlike any
      # environment the app is actually developed against.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      enable-sbom: true

      # ── E2E browser tests ────────────────────────────────────────────────
      # Previously LEFT OFF. The comment that lived here recorded two blockers
      # from run 30692400428; both are now addressed, so the reasons are kept
      # (not deleted) next to what changed:
      #
      #  1. "`occ app:enable planix` cannot import the register on a fresh CI
      #     instance: User 'Anonymous' does not have permission to 'create'
      #     objects in schema 'Label'." Still true, and it always will be — an
      #     IRepairStep runs with no user session, and InitializeSettings::run()
      #     swallows the resulting exception as a warning so `occ app:enable`
      #     still exits 0. FIXED by not relying on it: `ci-seed.sh` performs the
      #     import explicitly over the admin HTTP API
      #     (POST /apps/planix/api/settings/load → loadConfiguration(force:true))
      #     and then VERIFIES the register + schema slugs, so a bad provision is
      #     one loud step failure instead of a dozen misleading spec failures.
      #
      #  2. "globalSetup times out on input[name=\"user\"] at /index.php/login …
      #     php -S is single-threaded." FIXED upstream: the shared workflow now
      #     starts the built-in server with PHP_CLI_SERVER_WORKERS=8, so page
      #     loads no longer serialise their sub-resource requests behind each
      #     other. ci-seed.sh additionally warms the app page and pulls the
      #     webpack bundle before the first spec runs.
      #
      # The old "never recorded a single success anywhere in the fleet" control
      # no longer holds either: opencatalogi's job is green as of PR #787/#790,
      # which is the reference this repo's setup is modelled on.
      enable-playwright: true
      # Double duty in the shared workflow: it is both the directory the
      # "Validate Playwright tests exist" step counts *.spec.ts in, AND the
      # FIRST place the run step looks for a config
      # (`${playwright-test-path}/playwright.config.ts`), falling back to the
      # repo root only if that file is absent. We ship
      # tests/e2e/playwright.config.ts precisely so that lookup hits it: the run
      # step passes no `--project`, so the ROOT config would also run
      # `docs-capture` and re-shoot every documentation screenshot on every PR.
      playwright-test-path: tests/e2e
      # cwd for this step is the Nextcloud server root.
      playwright-seed-command: 'bash apps/planix/tests/e2e/ci-seed.sh'

      # ── Integration tests ────────────────────────────────────────────────
      # Was explicitly `false`. tests/integration/planix.postman_collection.json
      # had never executed in CI. It sits at the default
      # `newman-collection-path` (tests/integration), which is both the
      # directory the validator counts collections in and the directory the run
      # step globs `*.postman_collection.json` in — flat, not recursively.
      enable-newman: true

      # ── Frontend Check legs ──────────────────────────────────────────────
      # `frontend-checks` defaults to `[]`, and an empty list means the shared
      # workflow emits NO "Frontend Check" job at all — so `check:manifest` ran
      # nowhere while the run still looked complete.
      # `check:l10n` is deliberately NOT listed here: the dedicated
      # `l10n-parity` job below already runs it, and a second copy would be the
      # same check twice with nothing extra to show for it.
      # Measured on this tree before enabling: `check:manifest` FAILS —
      # `top-level: menu (array) is required` and `pages (array) is required`,
      # i.e. planix's src/manifest.json does not carry the fleet manifest shape
      # at all. A real pre-existing defect; the gate is what makes it visible.
      # `test` is NOT listed: "Frontend Tests (unit)" already runs it.
      frontend-checks: '["check:manifest"]'

      # ── Coverage ratchet ─────────────────────────────────────────────────
      # `enable-coverage-guard` defaults to FALSE, which is why both
      # "Coverage Baseline Protection" and "Coverage Baseline Check" have only
      # ever reported `skipped`. It needs two inputs this repo did not have,
      # both added in this commit: `scripts/coverage-guard.php` (byte-identical
      # to openregister's) and `.coverage-baseline` = 69.15, this repo's own
      # measured coverage (872 of 1261 statements) read from clover.xml in the
      # `coverage-report` artifact of run 30911196345.
      enable-coverage-guard: true

      # ── Hydra mechanical gates ───────────────────────────────────────────
      # `enable-hydra-gates` defaults to FALSE, so this tier has never executed
      # here — the job reported `skipped`, which the Quality Report renders
      # identically to a pass. Pinned to v1.3.0 so a change to the gate package
      # cannot move this repo's verdict without a commit here.
      # `enable-axe` deliberately NOT set: a vanilla Nextcloud 34 already carries
      # serious/critical violations from core's own UI.
      enable-hydra-gates: true
      # PIN MOVED v1.0.1 -> v1.3.0. `hydra-gates-require-full-coverage`
      # (default ON) fails a run when a gate whose subject matter EXISTS did
      # not report; its contract is that a not-applicable gate must DECLARE
      # itself. v1.0.1 contains ZERO `_skip` calls — no na/structural/wiring
      # vocabulary at all — so such a gate emits NOTHING and is counted as
      # "DID NOT RUN". v1.3.0 ships 36 such declarations. Measured on doriath
      # (PR #160): gates 4/24/33 went from unexplained "DID NOT RUN" to
      # explicit NOT APPLICABLE, and Hydra Gates went failure -> success.
      hydra-gates-ref: v1.3.0

  # Translation-completeness gate: every required European locale must carry a
  # real translation for every key in l10n/en.json. Dependency-free pure Node
  # so it runs in a bare node container without an npm install.
  l10n-parity:
    runs-on: ubuntu-latest
    # Observed over 17 runs: median 0.2 min, max 0.7 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check required-locale translation parity
        run: npm run check:l10n
