name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  oas-version-sync:
    name: OAS version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert openapi.yaml version matches appinfo/info.xml
        run: |
          INFO_VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          OAS_VERSION=$(grep -oP '(?<=^  version: )\S+' docs/openapi.yaml)
          echo "appinfo/info.xml version : $INFO_VERSION"
          echo "docs/openapi.yaml version: $OAS_VERSION"
          if [ "$INFO_VERSION" != "$OAS_VERSION" ]; then
            echo "ERROR: version mismatch — bump docs/openapi.yaml to match appinfo/info.xml"
            exit 1
          fi

  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: planix
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: false
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"main"}]'
      enable-sbom: true
