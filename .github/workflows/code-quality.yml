name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    uses: Conduction/.github/.github/workflows/quality.yml@main
    with:
      app-name: planix
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: false
      # The Playwright regression suite (tests/e2e, `chromium` project) had
      # never run on a pull request — the flag was simply absent, so the
      # "E2E Tests (Playwright)" job reported SKIPPED on every PR while the
      # specs looked like coverage to gate-19.
      #
      # `tests/e2e/base-url.ts` accepts the `BASE_URL` this workflow exports;
      # do not narrow it to PLAYWRIGHT_BASE_URL only (openconnector did, and its
      # E2E job has hard-failed on every run since).
      enable-playwright: true
      # ⚠️ This flag is UNVERIFIED, and could not be verified: at the time of
      # writing `Code Quality` fails at workflow-PARSE time ("This run likely
      # failed because of a workflow file issue", 0s, zero jobs) on planix
      # `development` itself and on procest and docudesk `development` too —
      # i.e. on unmodified workflow files. The breakage is in the shared
      # `Conduction/.github@main` reusable workflow, not here.
      #
      # `playwright-test-path` is deliberately not set: planix's specs are in
      # the default `tests/e2e`. Its OpenRegister register is created by an
      # IRepairStep (lib/Repair/InitializeSettings.php) that the workflow's own
      # `occ app:enable planix` runs on a fresh install, so no seed command is
      # needed either.
      additional-apps: '[{"repo":"Conduction/openregister","app":"openregister","ref":"main"}]'
      enable-sbom: true

  # Translation-completeness gate: every required European locale must carry a
  # real translation for every key in l10n/en.json. Dependency-free pure Node
  # so it runs in a bare node container without an npm install.
  l10n-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check required-locale translation parity
        run: npm run check:l10n
