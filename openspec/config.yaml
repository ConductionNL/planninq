schema: conduction

context: |
  Project: Planix
  Repo: ConductionNL/planix
  Type: Nextcloud App (PHP backend + Vue 2 frontend)
  Description: Flow-based kanban project and task management for Nextcloud — manages projects, tasks, kanban boards, and time entries for dev and IT teams
  Key components: Projects (kanban containers), Tasks (work items), Columns (kanban stages), TimeEntries (time logs), Labels (cross-project tags)
  Database: PostgreSQL (via OpenRegister's ObjectService)
  Mount path: /var/www/html/custom_apps/planix

  Standards:
    Primary: iCalendar VTODO (RFC 5545) for task field reference
    Semantic: Schema.org JSON-LD type annotations (Action, PlanAction, CreativeWork, ItemList, DefinedTerm, QuantitativeValue)
    API mapping: VNG ZGW InterneTaak (Dutch government task interoperability)
    Pattern: OpenProject Work Package model, GitHub Issues (proven dev-team task model)

  Architecture:
    Pattern: Thin client — Planix owns no database tables
    Data layer: OpenRegister (JSON object storage with schema validation)
    Frontend: Vue 2.7 + Pinia stores querying OpenRegister API directly
    Backend: Minimal — SettingsController + ConfigurationService for register setup; NotificationService for task events
    Shared library: @conduction/nextcloud-vue (components, stores, composables, NL Design CSS)
    Nextcloud reuse: Users (IUserManager), Files (IRootFolder), Activity (IManager),
                     Comments (ICommentsManager), Notifications (IManager), Calendar (IManager, optional VTODO sync)

  Sister app: Procest (case management) — receives task references via caseReference on Project and zaakUuid on Task
  Shared specs: See ../openspec/specs/ for cross-project conventions
  Project guidelines: See ../project.md for workspace-wide standards
  Architecture: See docs/ARCHITECTURE.md for standards research and data model decisions
  Features: See docs/FEATURES.md for competitive analysis and feature roadmap

rules:
  proposal:
    - Reference shared nextcloud-app spec for app structure requirements
    - Reference docs/ARCHITECTURE.md for data model and standards decisions
    - Consider Procest bridge impact (case → project/task) when touching project or task entities
    - Reference docs/FEATURES.md for feature tier (MVP/V1/Enterprise)
    - "ADR-011: Before implementing ANY utility (validation, formatting, parsing), search OpenRegister lib/Formats/, lib/Service/, and lib/Handler/ for existing implementations. If found, reuse via DI."
  specs:
    - Use Schema.org type annotations for all entities (e.g., schema:Action, schema:CreativeWork)
    - Reference iCalendar VTODO (RFC 5545) field names in property tables (e.g., SUMMARY, DUE, STATUS)
    - Include VNG InterneTaak mapping column where applicable
    - Specify which Nextcloud OCP interfaces are used for integration features
    - Reference FEATURES.md tier for each requirement (MVP/V1/Enterprise)
  design:
    - Uses OpenRegister API directly from frontend (no own backend CRUD)
    - Register config in lib/Settings/planix_register.json (OpenAPI 3.0.0 format)
    - Imported via ConfigurationService::importFromApp() in repair step
    - Reference Nextcloud OCP interfaces for all platform integrations
    - MUST use @conduction/nextcloud-vue components (CnDataTable, CnListViewLayout, CnDetailPage, CnObjectSidebar, etc.)
    - MUST use CnDetailPage + CnObjectSidebar for task detail views (card-based layout with right sidebar for files, notes, tags, tasks, audit trail)
    - MUST use useObjectStore from @conduction/nextcloud-vue for all OpenRegister data operations
    - MUST use useListView/useDetailView composables for page state management
    - MUST add @conduction/nextcloud-vue npm dependency (^0.1.0-beta.1) + conditional webpack alias + dedup aliases
    - MUST use NL Design System double-fallback CSS pattern (cn- prefix)
    - MUST use Vue Router (hash mode) for all navigation — src/router/index.js, registered in main.js, <router-view /> in App.vue
    - MainMenu navigation via :to prop on NcAppNavigationItem (NOT @click + $router.push())
    - "Detail views use route props functions: props: route => ({ taskId: route.params.id })"
    - Kanban board is a custom Planix component (drag-and-drop) built on @conduction/nextcloud-vue base components
    - Check OpenRegister dependency and show NcEmptyContent when not installed
  tasks:
    - Tag tasks with feature tier (MVP/V1/Enterprise)
    - Test with OpenRegister to verify schema validation works
    - Verify Nextcloud integration features with actual OCP interfaces
    - Test drag-and-drop kanban with realistic task counts (50+ tasks per board)
