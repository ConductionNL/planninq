description:
  en:
    shortDescription: >
      Kanban-based project and task management for Nextcloud.
    longDescription: >
      Planninq is a kanban-based project and task management application for Nextcloud.
      It enables teams to visualise workflows, track progress on tasks and projects,
      and collaborate effectively. Built on Open Register, it integrates with the
      Nextcloud ecosystem and supports agile and lean work methodologies suitable
      for both government organisations and businesses.
      Conduction maintains this component at its own cost, committed until 31 December 2027.
    documentation: "https://github.com/ConductionNL/planninq/tree/development/docs"
    features:
      - Kanban board with configurable columns and WIP limits
      - Projects with team members and their own board
      - Tasks with priorities, labels, assignees and due dates
      - Backlog for unscheduled work, promoted to the board by drag and drop
      - Personal dashboard and my work overview
      - Time estimates, time entries and a personal timesheet
      - Task dependencies with a blocked badge on the card
      - Optional case references to link tasks and projects to Procest
      - All data stored as OpenRegister objects
      - NL Design System theming with CSS variables and WCAG AA
    screenshots:
      - docs/features/img/projects-list.png
      - docs/features/img/projects-create.png
      - docs/features/img/projects-settings.png

  nl:
    shortDescription: >
      Kanban-gebaseerd project- en taakbeheer voor Nextcloud.
    longDescription: >
      Planninq is een kanban-gebaseerde project- en taakbeheertoepassing voor Nextcloud.
      Het stelt teams in staat om workflows te visualiseren, voortgang bij te houden
      op taken en projecten en effectief samen te werken. Gebouwd op Open Register
      integreert het met het Nextcloud-ecosysteem en ondersteunt agile en lean
      werkmethoden die geschikt zijn voor zowel overheidsorganisaties als bedrijven.
      Conduction onderhoudt dit component voor eigen rekening, toegezegd tot 31 december 2027.
    documentation: "https://github.com/ConductionNL/planninq/tree/development/docs"
    features:
      - Kanbanbord met configureerbare kolommen en WIP-limieten
      - Projecten met teamleden en een eigen bord
      - Taken met prioriteiten, labels, toegewezenen en deadlines
      - Backlog voor niet-ingeplande taken, met slepen naar het bord
      - Persoonlijk dashboard en overzicht van mijn werk
      - Tijdsinschattingen, tijdregistraties en een persoonlijk urenoverzicht
      - Afhankelijkheden tussen taken met een geblokkeerd-badge op de kaart
      - Optionele zaakreferenties om taken en projecten aan Procest te koppelen
      - Alle gegevens opgeslagen als OpenRegister-objecten
      - NL Design System-thema met CSS-variabelen en WCAG AA
    screenshots:
      - docs/features/img/projects-list.png
      - docs/features/img/projects-create.png
      - docs/features/img/projects-settings.png

